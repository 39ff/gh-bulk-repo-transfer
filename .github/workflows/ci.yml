name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "Run gofmt -w ."; exit 1; }
      - name: Test the release version script
        if: runner.os == 'Linux'
        run: .github/scripts/next-version_test.sh
      - run: go vet ./...
      - run: go test ./...

  build:
    name: Build snapshot binaries
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      # "binary" archives are not copied into dist/; GoReleaser uploads the
      # built file under the name recorded in artifacts.json.
      - name: Check gh extension asset names
        run: |
          jq -r '.[] | select(.type == "Binary") | "\(.name)\t\(.path)"' dist/artifacts.json
          mkdir -p dist/gh-extension
          jq -r '.[] | select(.type == "Binary" and (.name | startswith("gh-bulk-repo-transfer_"))) | [.path, .name] | @tsv' dist/artifacts.json |
            while IFS=$'\t' read -r path name; do cp "$path" "dist/gh-extension/$name"; done
          ls -l dist/gh-extension
          for p in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64 windows-amd64.exe windows-arm64.exe; do
            ls dist/gh-extension/gh-bulk-repo-transfer_*_"$p" >/dev/null || { echo "::error::missing gh extension asset for $p"; exit 1; }
          done
      - uses: actions/upload-artifact@v7
        with:
          name: snapshot-binaries
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/gh-extension/*
            dist/checksums.txt
          retention-days: 14
