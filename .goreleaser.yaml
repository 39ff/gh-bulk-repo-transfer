# GoReleaser config: https://goreleaser.com/customization/
version: 2

project_name: gh-bulk-repo-transfer

builds:
  - id: ghbt
    main: ./cmd/ghbt
    binary: ghbt
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .Date }}

archives:
  # Standalone downloads: ghbt binary + docs.
  - id: standalone
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "ghbt_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - README.ja.md
      - LICENSE
  # Raw binaries for "gh extension install": gh picks the asset whose name
  # ends with <os>-<arch> (".exe" on Windows) from the latest release.
  - id: gh-extension
    formats: [binary]
    name_template: "gh-bulk-repo-transfer_{{ .Tag }}_{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
